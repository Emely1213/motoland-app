<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motoland Service</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
header{background:#1e3a8a;color:white;text-align:center;padding:15px;font-weight:bold}
.nav{display:flex;gap:5px;padding:10px;background:white}
.nav button{flex:1;padding:10px;border:none;border-radius:10px;background:#e0e7ff;color:#1e3a8a;font-weight:bold}
.section{display:none;padding:15px}
.active{display:block}
.card{background:white;padding:15px;border-radius:12px;margin-top:10px}
input,select,button,textarea{width:100%;padding:10px;margin-top:5px;border-radius:8px}
</style>
</head>

<body>

<header>🏍️ Motoland Service</header>

<div class="nav">
<button onclick="cambiar('dashboard')">Dashboard</button>
<button onclick="cambiar('inventario')">Inventario</button>
<button onclick="cambiar('ventas')">Ventas</button>
<button onclick="cambiar('mantenimiento')">Mantenimientos</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
<div class="card">
<h3>Total Ventas</h3>
<strong id="totalVentas">$0</strong>
</div>

<div class="card">
<h3>Ganancias</h3>
<strong id="ganancias">$0</strong>
</div>

<div class="card">
<h3>Gastos</h3>
<strong id="gastos">$0</strong>
</div>

<canvas id="grafica"></canvas>
</div>

<!-- INVENTARIO -->
<div id="inventario" class="section">
<div class="card">
<h3>Inventario</h3>

<input id="idInv" placeholder="ID">
<input id="identificacionInv" placeholder="Identificación">
<input id="producto" placeholder="Producto">
<input id="marca" placeholder="Marca">
<input id="stock" type="number" placeholder="Stock">
<input id="compra" type="number" placeholder="Precio compra">
<input id="venta" type="number" placeholder="Precio venta">

<button onclick="guardarProducto()">Guardar</button>
</div>
</div>

<!-- VENTAS -->
<div id="ventas" class="section">
<div class="card">
<h3>Ventas</h3>

<input id="idVenta" placeholder="ID">
<input id="identificacionVenta" placeholder="Identificación">
<select id="ventaProd"></select>
<input id="marcaVenta" placeholder="Marca">
<input id="ventaCant" type="number" placeholder="Cantidad">
<input id="precioVenta" type="number" placeholder="Precio">

<button onclick="venderProducto()">Vender</button>
</div>
</div>

<!-- MANTENIMIENTO -->
<div id="mantenimiento" class="section">
<div class="card">

<h3>Mantenimiento</h3>

<input id="idM" placeholder="ID">
<input id="clienteM" placeholder="Cliente">
<input id="contactoM" placeholder="Contacto">
<input id="motoM" placeholder="Moto">
<input id="modeloM" placeholder="Modelo">
<input id="placaM" placeholder="Placa">
<input id="servicioM" placeholder="Servicio">
<input id="productoM" placeholder="Producto usado">
<input id="cantidadM" type="number" placeholder="Cantidad">
<input id="valorM" type="number" placeholder="Valor servicio">

<select id="estadoManual">
<option value="Nuevo">🟢 Nuevo</option>
<option value="Proceso">🟡 Proceso</option>
<option value="Terminado">🔴 Terminado</option>
</select>

<button onclick="guardarMantenimiento()">Guardar</button>

<hr>

<h3>Buscar / Actualizar</h3>

<input id="buscarPlaca" placeholder="Buscar por placa">
<button onclick="buscarMantenimiento()">Buscar</button>

<select id="listaMantenimientos"></select>

<select id="estadoUpdate">
<option value="Nuevo">🟢 Nuevo</option>
<option value="Proceso">🟡 Proceso</option>
<option value="Terminado">🔴 Terminado</option>
</select>

<textarea id="observaciones" placeholder="Observaciones..."></textarea>

<button onclick="actualizarMantenimiento()">Actualizar</button>

</div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbzp-g7dz1DSd61NyylmVI1-Y7vDlIudTcgyX3lNxkSg8itaiuuoGFHPllvOz4Tu3jOR/exec";

let grafica;

// errores visibles
window.onerror = function(msg){
  alert("Error: " + msg);
}

// navegación
function cambiar(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// INVENTARIO
function guardarProducto(){
  fetch(URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      tipo:"inventario",
      id:idInv.value,
      identificacion:identificacionInv.value,
      producto:producto.value,
      marca:marca.value,
      stock:stock.value,
      compra:compra.value,
      venta:venta.value
    })
  });
  alert("Producto guardado ✔");
  cargarTodo();
}

// EDITAR PRODUCTO
function editarProducto(nombre){
  let nuevoPrecio = prompt("Nuevo precio:");
  fetch(URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      tipo:"editarProducto",
      producto:nombre,
      precio:nuevoPrecio
    })
  });
  cargarTodo();
}

// ELIMINAR PRODUCTO
function eliminarProducto(nombre){
  fetch(URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      tipo:"eliminarProducto",
      producto:nombre
    })
  });
  alert("Eliminado");
  cargarTodo();
}

// VENTAS
async function venderProducto(){
  const res = await fetch(URL);
  const data = await res.json();

  let productos = data.inventario.slice(1);
  let prod = productos.find(p=>p[3]==ventaProd.value);

  if(!prod){ alert("Producto no encontrado"); return; }

  let cantidad = Number(ventaCant.value);
  let precio = Number(precioVenta.value);

  let total = cantidad * precio;
  let ganancia = (precio - Number(prod[6])) * cantidad;

  await fetch(URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      tipo:"ventas",
      producto:prod[3],
      marca:prod[4],
      cantidad,
      precio,
      total,
      ganancia
    })
  });

  await fetch(URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      tipo:"actualizarStock",
      producto:prod[3],
      nuevoStock: Number(prod[5]) - cantidad
    })
  });

  alert("Venta realizada ✔");
  cargarTodo();
}

// DASHBOARD + INVENTARIO
async function cargarTodo(){
  const res = await fetch(URL);
  const data = await res.json();

  // ventas
  let ventas = data.ventas.slice(1);
  let totalV=0, gan=0;

  ventas.forEach(v=>{
    totalV += Number(v[6])||0;
    gan += Number(v[7])||0;
  });

  totalVentas.innerText="$"+totalV;
  ganancias.innerText="$"+gan;

  // mantenimientos
  let mant = data.mantenimientos.slice(1);
  let gas=0;
  mant.forEach(m=> gas += Number(m[10])||0);
  gastos.innerText="$"+gas;

  // INVENTARIO + ALERTA
  let productos = data.inventario.slice(1);
  ventaProd.innerHTML="";
  
  let lista = "";

  productos.forEach(p=>{
    ventaProd.innerHTML += `<option>${p[3]}</option>`;

    let alerta = p[5] < 5 ? "🔴 BAJO STOCK" : "🟢 OK";

    lista += `
    <div class="card">
      <b>${p[3]}</b> (${p[4]})<br>
      Stock: ${p[5]} - ${alerta}<br>
      💲 ${p[7]}
      <br><br>
      <button onclick="editarProducto('${p[3]}')">✏️ Editar</button>
      <button onclick="eliminarProducto('${p[3]}')">🗑️ Eliminar</button>
    </div>
    `;
  });

  document.getElementById("inventario").innerHTML += lista;

  // GRAFICA
  let labels = ventas.map(v=>v[3]);
  let datos = ventas.map(v=>Number(v[6]));

  if(grafica) grafica.destroy();

  grafica = new Chart(document.getElementById("grafica"),{
    type:"bar",
    data:{
      labels: labels,
      datasets:[{
        label:"Ventas",
        data: datos
      }]
    }
  });
}

// REFRESH
setInterval(cargarTodo,4000);
cargarTodo();
</script>
</body>
</html>
